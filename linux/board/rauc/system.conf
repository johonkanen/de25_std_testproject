# RAUC system configuration for the DE25-Standard (docs/plan_rauc.md).
#
# Step 1: the booted rootfs as one read-only slot (bootloader=noop; the
# P1 + rootfs.1 slot group comes in step 2) and two artifact repositories,
# "gui" (GUI releases) and "core" (FPGA cores). RAUC only installs; the
# post-install handler hands each new artifact to the code that tests it
# and rolls it back (the GUI supervisor, fpga_access.py).
# Bundles must be signed by a certificate that chains to keyring.pem.

[system]
compatible=de25-std
bootloader=noop
# RAUC's own state; on the rootfs until step 2 adds a data partition
data-directory=/var/lib/rauc

[keyring]
path=/etc/rauc/keyring.pem
# the signer certificate must carry extendedKeyUsage=codeSigning
check-purpose=codesign

[handlers]
post-install=/usr/lib/rauc/post-install

# The running root filesystem. RAUC must recognise the booted slot (root= on
# the kernel command line) before it installs anything, even artifacts.
# readonly: never written by RAUC in step 1.
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
readonly=true

[artifacts.gui]
description=Web GUI releases (fpga_web.py, fpga_access.py, temp_control.py, static/)
path=/var/lib/rauc/gui
type=trees

[artifacts.core]
description=FPGA cores: de25_std.core.rbf + de25_std.core.json
path=/var/lib/rauc/core
type=trees
