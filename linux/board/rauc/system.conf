# RAUC system configuration for the DE25-Standard (docs/plan_rauc.md).
#
# Step 2, A/B: two application images in QSPI, P1 and P2 (make_jic.sh), each
# with its own rootfs on the card; U-Boot boots the rootfs of the image the
# SDM started and names it in root=, which is how RAUC knows the booted
# slot. An image bundle goes into the group that is not running: its
# rootfs (written by RAUC) and its QSPI image (written by the bundle's
# install hook through fpga_access.py). The boot backend (bootloader) maps
# RAUC's primary/good/bad onto the SDM's slot priorities.
#
#   group P1: rootfs.0 (mmcblk0p3) + qspi.0
#   group P2: rootfs.1 (mmcblk0p5) + qspi.1
#   recovery.0 (mmcblk0p2): the factory image's rootfs, never written; a
#   class of its own, so it is never picked as a target
#
# Plus two artifact repositories (step 1), "gui" and "core": the
# post-install handler hands them to the GUI supervisor and fpga_access.py.
# Bundles must be signed by a certificate that chains to keyring.pem.

[system]
compatible=de25-std
bootloader=custom
# RAUC's own state, on the data partition: shared by every slot
data-directory=/data/rauc

[keyring]
path=/etc/rauc/keyring.pem
# the signer certificate must carry extendedKeyUsage=codeSigning
check-purpose=codesign

[handlers]
post-install=/usr/lib/rauc/post-install
bootloader-custom-backend=/usr/lib/rauc/bootloader

[slot.recovery.0]
device=/dev/mmcblk0p2
type=ext4
bootname=FACTORY_IMAGE
readonly=true

[slot.rootfs.0]
device=/dev/mmcblk0p3
type=ext4
bootname=P1
# the image is smaller than the partition (make_sdcard_image.sh ROOTFS_MB)
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p5
type=ext4
bootname=P2
resize=true

# The QSPI image (application image, its U-Boot and its core): written only
# by the bundle's install hook (hooks=install), which hands it to
# fpga_access.py (install_rsu). device= is where librsu works (librsu.rc).
[slot.qspi.0]
device=/dev/mtd1
type=raw
parent=rootfs.0

[slot.qspi.1]
device=/dev/mtd1
type=raw
parent=rootfs.1

[artifacts.gui]
description=Web GUI releases (fpga_web.py, fpga_access.py, temp_control.py, static/)
path=/data/rauc/gui
type=trees

[artifacts.core]
description=FPGA cores: de25_std.core.rbf + de25_std.core.json
path=/data/rauc/core
type=trees
